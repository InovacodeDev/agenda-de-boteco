name: CD - Deploy to App Stores

on:
  push:
    branches:
      - alfa
      # - beta  # canal pausado: sem deploy por enquanto (descomente para religar)
      - release

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-gate:
    name: Version Gate (tag check)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure version is not already deployed on this channel
        id: check
        run: |
          set -euo pipefail
          version=$(jq -r '.version' apps/mobile/package.json)
          tag="${GITHUB_REF_NAME}-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::A versão $version já foi publicada no canal $GITHUB_REF_NAME (tag $tag existe). Bumpe apps/mobile/package.json antes de subir."
            exit 1
          fi
          echo "Tag $tag ainda não existe — liberado para deploy."

  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    needs: version-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Test
        run: pnpm run test

      - name: Run OTA Test
        run: pnpm run test:ota

  migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref_name == 'release'

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Push pending migrations
        run: supabase db push --yes

  deploy:
    name: Build & Deploy (${{ matrix.app.dir }})
    runs-on: ubuntu-latest
    needs: [version-gate, verify, migrate]
    # NOTE: migrate só roda em release; em alfa fica "skipped" e o deploy precisa seguir mesmo assim.
    if: ${{ !cancelled() && needs.version-gate.result == 'success' && needs.verify.result == 'success' && needs.migrate.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        app:
          - dir: apps/mobile
            filter: '@agenda/mobile'
            submit: true
          - dir: apps/mobile-client
            filter: '@agenda/mobile-client'
            submit: false

    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine EAS Channel Profile
        run: |
          # alfa = preview (build sem submissão). release = produção nas lojas.
          # beta está pausado e nem dispara este workflow.
          if [ "${{ github.ref_name }}" = "alfa" ]; then
            echo "CHANNEL_PROFILE=alfa" >> "$GITHUB_ENV"
            echo "EAS_ENVIRONMENT=preview" >> "$GITHUB_ENV"
            echo "SUBMIT_TO_STORES=false" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            echo "CHANNEL_PROFILE=beta" >> "$GITHUB_ENV"
            echo "EAS_ENVIRONMENT=preview" >> "$GITHUB_ENV"
            echo "SUBMIT_TO_STORES=false" >> "$GITHUB_ENV"
          else
            echo "CHANNEL_PROFILE=production" >> "$GITHUB_ENV"
            echo "EAS_ENVIRONMENT=production" >> "$GITHUB_ENV"
            if [ "${{ matrix.app.submit }}" = "true" ]; then
              echo "SUBMIT_TO_STORES=true" >> "$GITHUB_ENV"
            else
              echo "SUBMIT_TO_STORES=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Publish OTA update
        id: ota
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ vars.R2_BUCKET || 'agenda-ota' }}
          POSTHOG_CLI_TOKEN: ${{ secrets.POSTHOG_CLI_TOKEN }}
        run: |
          set +e
          pnpm --filter "${{ matrix.app.filter }}" exec eas env:exec "$EAS_ENVIRONMENT" -- \
            node ../../scripts/ota/publish.mjs --app "${{ matrix.app.dir }}" --channel "$CHANNEL_PROFILE"
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 78 ]; then
            exit "$rc"
          fi

      - name: Build (and submit to stores on release only)
        if: steps.ota.outputs.needs_native_build == 'true'
        run: |
          set -o pipefail
          submit_args=()
          if [ "$SUBMIT_TO_STORES" = "true" ]; then
            submit_args+=(--auto-submit-with-profile "$CHANNEL_PROFILE")
          fi
          pnpm --filter "${{ matrix.app.filter }}" exec eas build \
            --platform all \
            --profile "$CHANNEL_PROFILE" \
            "${submit_args[@]}" \
            --non-interactive \
            --no-wait \
            --json | tee "$RUNNER_TEMP/eas-build.json"

      - name: Register native build in ota_native_builds
        if: steps.ota.outputs.needs_native_build == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          pnpm --filter "${{ matrix.app.filter }}" exec eas env:exec "$EAS_ENVIRONMENT" -- \
            node ../../scripts/ota/register-native-build.mjs \
              --app "${{ matrix.app.dir }}" \
              --channel "$CHANNEL_PROFILE" \
              --build-json "$RUNNER_TEMP/eas-build.json"

      - name: Publish build links to summary
        if: always()
        run: |
          {
            echo "## Deploy \`${{ matrix.app.dir }}\` — canal \`$CHANNEL_PROFILE\` (\`$GITHUB_REF_NAME\`)"
            echo ""
            if [ "${{ steps.ota.outputs.needs_native_build }}" = "false" ]; then
              echo "✅ **OTA publicado** (release \`${{ steps.ota.outputs.ota_release_ids }}\`)."
            elif [ -s "$RUNNER_TEMP/eas-build.json" ] && jq -e 'type == "array"' "$RUNNER_TEMP/eas-build.json" >/dev/null 2>&1; then
              echo "🏗️ **Build nativo** disparado no EAS:"
              echo ""
              echo "| Plataforma | Build | Status |"
              echo "| :--- | :--- | :--- |"
              jq -r '.[] | "| \(.platform // "?") | [\(.id // "build")](\(.buildDetailsPageUrl // .buildPageUrl // .artifacts.buildUrl // "https://expo.dev/builds")) | \(.status // "queued") |"' \
                "$RUNNER_TEMP/eas-build.json"
              echo ""
              if [ "$SUBMIT_TO_STORES" = "true" ]; then
                echo "Acompanhe o build e o auto-submit no [dashboard do EAS](https://expo.dev/builds)."
              else
                echo "🔍 Build de **preview** — nenhuma submissão às lojas neste canal."
              fi
            else
              echo "⚠️ Nenhum deploy concluído (job pode ter falhado antes do OTA ou \`eas build\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tag:
    name: Tag deployed version
    runs-on: ubuntu-latest
    needs: [version-gate, deploy]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag deployed version
        run: |
          set -euo pipefail
          tag="${{ needs.version-gate.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag já existe — nada a fazer."
            exit 0
          fi
          git tag "$tag"
          if ! git push origin "refs/tags/$tag"; then
            git fetch --tags --force
            git rev-parse -q --verify "refs/tags/$tag" >/dev/null || exit 1
            echo "Tag $tag criada em paralelo — ok."
            exit 0
          fi
          echo "Tag $tag criada — este canal fica bloqueado até o próximo bump de versão."
