name: CD - Deploy to App Stores

on:
  push:
    branches:
      - alfa
      # - beta  # canal pausado: sem deploy por enquanto (descomente para religar)
      - release

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version-gate:
    name: Version Gate (tag check)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure version is not already deployed on this channel
        id: check
        run: |
          set -euo pipefail
          version=$(jq -r '.version' apps/mobile/package.json)
          tag="${GITHUB_REF_NAME}-v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --tags --force
          # Mesma regra do ci.yml: alfa aceita patch, beta/release exigem minor.
          bash scripts/check-channel-version.bash "${GITHUB_REF_NAME}" "$version"

  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest
    needs: version-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Test
        run: pnpm run test

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: [version-gate, verify]

    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine EAS Channel Profile
        run: |
          # alfa = preview (build sem submissão). release = produção nas lojas.
          # beta está pausado e nem dispara este workflow.
          if [ "${{ github.ref_name }}" = "alfa" ]; then
            echo "CHANNEL_PROFILE=alfa" >> "$GITHUB_ENV"
            echo "SUBMIT_TO_STORES=false" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            echo "CHANNEL_PROFILE=beta" >> "$GITHUB_ENV"
            echo "SUBMIT_TO_STORES=false" >> "$GITHUB_ENV"
          else
            echo "CHANNEL_PROFILE=production" >> "$GITHUB_ENV"
            echo "SUBMIT_TO_STORES=true" >> "$GITHUB_ENV"
          fi

      - name: Build (and submit to stores on release only)
        run: |
          set -o pipefail
          submit_args=()
          if [ "$SUBMIT_TO_STORES" = "true" ]; then
            submit_args+=(--auto-submit-with-profile "$CHANNEL_PROFILE")
          fi
          pnpm --filter @agenda/mobile exec eas build \
            --platform all \
            --profile "$CHANNEL_PROFILE" \
            "${submit_args[@]}" \
            --non-interactive \
            --no-wait \
            --json | tee "$RUNNER_TEMP/eas-build.json"

      - name: Tag deployed version
        run: |
          set -euo pipefail
          tag="${{ needs.version-gate.outputs.tag }}"
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "Tag $tag criada — este canal fica bloqueado até o próximo bump de versão."

      - name: Publish build links to summary
        if: always()
        run: |
          {
            echo "## EAS Build — canal \`$CHANNEL_PROFILE\` (\`$GITHUB_REF_NAME\`)"
            echo ""
            if [ -s "$RUNNER_TEMP/eas-build.json" ] && jq -e 'type == "array"' "$RUNNER_TEMP/eas-build.json" >/dev/null 2>&1; then
              echo "| Plataforma | Build | Status |"
              echo "| :--- | :--- | :--- |"
              jq -r '.[] | "| \(.platform // "?") | [\(.id // "build")](\(.buildDetailsPageUrl // .buildPageUrl // .artifacts.buildUrl // "https://expo.dev/builds")) | \(.status // "queued") |"' \
                "$RUNNER_TEMP/eas-build.json"
              echo ""
              if [ "$SUBMIT_TO_STORES" = "true" ]; then
                echo "Acompanhe o build e o auto-submit no [dashboard do EAS](https://expo.dev/builds)."
              else
                echo "🔍 Build de **preview** — nenhuma submissão às lojas neste canal."
              fi
            else
              echo "⚠️ Nenhum build foi disparado (job pode ter falhado antes do \`eas build\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
