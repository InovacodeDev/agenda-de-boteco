name: CD - Deploy to App Stores

on:
  push:
    branches:
      - alfa
      - beta
      - release

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Test
        run: pnpm run test

  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    needs: verify

    env:
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
      ASC_APP_ID: ${{ vars.ASC_APP_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Determine EAS Channel Profile
        run: |
          if [ "${{ github.ref_name }}" = "alfa" ]; then
            echo "CHANNEL_PROFILE=alfa" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_name }}" = "beta" ]; then
            echo "CHANNEL_PROFILE=beta" >> "$GITHUB_ENV"
          else
            echo "CHANNEL_PROFILE=production" >> "$GITHUB_ENV"
          fi

      - name: Build and Auto-Submit to App Stores
        run: |
          set -o pipefail
          pnpm --filter @agenda/mobile exec eas build \
            --platform all \
            --profile "$CHANNEL_PROFILE" \
            --auto-submit-with-profile "$CHANNEL_PROFILE" \
            --non-interactive \
            --no-wait \
            --json | tee "$RUNNER_TEMP/eas-build.json"

      - name: Publish build links to summary
        if: always()
        run: |
          {
            echo "## EAS Build — canal \`$CHANNEL_PROFILE\` (\`$GITHUB_REF_NAME\`)"
            echo ""
            if [ -s "$RUNNER_TEMP/eas-build.json" ] && jq -e 'type == "array"' "$RUNNER_TEMP/eas-build.json" >/dev/null 2>&1; then
              echo "| Plataforma | Build | Status |"
              echo "| :--- | :--- | :--- |"
              jq -r '.[] | "| \(.platform // "?") | [\(.id // "build")](\(.buildDetailsPageUrl // .buildPageUrl // .artifacts.buildUrl // "https://expo.dev/builds")) | \(.status // "queued") |"' \
                "$RUNNER_TEMP/eas-build.json"
              echo ""
              echo "Acompanhe o build e o auto-submit no [dashboard do EAS](https://expo.dev/builds)."
            else
              echo "⚠️ Nenhum build foi disparado (job pode ter falhado antes do \`eas build\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
