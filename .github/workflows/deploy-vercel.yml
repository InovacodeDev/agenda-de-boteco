name: CD - Deploy Web to Vercel

on:
  push:
    branches:
      - alfa
      - release
  workflow_dispatch:

concurrency:
  group: deploy-vercel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changed apps
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      admin: ${{ steps.filter.outputs.admin }}
      landing: ${{ steps.filter.outputs.landing }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Disparo manual é intencional: deploya todos, sem gate.
            changed="apps/web/x apps/admin/x apps/landing/x"
          else
            before="${{ github.event.before }}"
            # Primeiro push da branch (before = zeros) ou faixa indisponível:
            # cai para o último commit em vez de deployar tudo.
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="${GITHUB_SHA}~1..${GITHUB_SHA}"
            else
              range="$before..${GITHUB_SHA}"
            fi
            changed=$(git diff --name-only "$range")
          fi

          # Arquivos que não afetam o build publicado: markdown, CI, scripts.
          # Um commit só com eles não deploya nada.
          changed=$(echo "$changed" | grep -vE '(\.md$|^\.github/|^scripts/)' || true)

          # packages/core é consumido pelos três apps: mudança nele redeploya todos.
          if echo "$changed" | grep -qE '^(packages/core/|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|package\.json$)'; then
            shared=true
          else
            shared=false
          fi

          for app in web admin landing; do
            if [ "$shared" = "true" ] || echo "$changed" | grep -qE "^apps/$app/"; then
              echo "$app=true" >> "$GITHUB_OUTPUT"
            else
              echo "$app=false" >> "$GITHUB_OUTPUT"
            fi
          done
          echo "Arquivos considerados:"; echo "$changed"

  deploy:
    name: Deploy ${{ matrix.app }}
    runs-on: ubuntu-latest
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            project_id_secret: VERCEL_PROJECT_ID_WEB
          - app: admin
            project_id_secret: VERCEL_PROJECT_ID_ADMIN
          - app: landing
            project_id_secret: VERCEL_PROJECT_ID_LANDING

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project_id_secret] }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # release = produção; alfa = preview.
      TARGET: ${{ github.ref_name == 'release' && 'production' || 'preview' }}

    steps:
      - name: Skip if unchanged
        id: gate
        run: |
          changed="${{ needs.changes.outputs[matrix.app] }}"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          [ "$changed" = "true" ] || echo "apps/${{ matrix.app }} não mudou — pulando deploy."

      - uses: actions/checkout@v4
        if: steps.gate.outputs.changed == 'true'

      - uses: pnpm/action-setup@v4
        if: steps.gate.outputs.changed == 'true'
        with:
          version: 10.20.0

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.changed == 'true'
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.gate.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Pull Vercel environment
        if: steps.gate.outputs.changed == 'true'
        run: pnpm dlx vercel@latest pull --yes --environment=$TARGET --token=$VERCEL_TOKEN

      # As chaves vêm do .env.example do app (fonte de verdade); os valores, do
      # GitHub, sob o nome prefixado <APP_UPPER>_<CHAVE> — ex. WEB_NEXT_PUBLIC_SUPABASE_URL.
      # Secret ganha de variable. Chave sem valor no GitHub falha o job.
      - name: Materialize env from GitHub secrets/variables
        if: steps.gate.outputs.changed == 'true'
        env:
          APP: ${{ matrix.app }}
          ALL_SECRETS: ${{ toJSON(secrets) }}
          ALL_VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          example="apps/$APP/.env.example"
          if [ ! -f "$example" ]; then
            echo "::error::$example não existe — crie-o listando as variáveis do build."
            exit 1
          fi

          prefix=$(echo "$APP" | tr 'a-z-' 'A-Z_')
          keys=$(sed -n 's/^\([A-Za-z_][A-Za-z0-9_]*\)=.*$/\1/p' "$example" | sort -u)

          APP_PREFIX="$prefix" KEYS="$keys" node -e '
            const fs = require("fs");
            const secrets = JSON.parse(process.env.ALL_SECRETS);
            const vars = JSON.parse(process.env.ALL_VARS);
            const prefix = process.env.APP_PREFIX;
            const keys = process.env.KEYS.split("\n").filter(Boolean);

            const missing = [];
            const lines = [];
            for (const key of keys) {
              const name = `${prefix}_${key}`;
              const value = secrets[name] ?? vars[name] ?? "";
              if (!value) { missing.push(name); continue; }
              lines.push(`${key}=${value}`);
            }
            if (missing.length) {
              console.log(`::error::Faltam no GitHub secrets/variables: ${missing.join(", ")}`);
              process.exit(1);
            }
            fs.writeFileSync(`apps/${process.env.APP}/.env.production.local`, lines.join("\n") + "\n");
            console.log(`Variáveis injetadas: ${keys.join(", ")}`);
          '

      - name: Build
        if: steps.gate.outputs.changed == 'true'
        run: |
          if [ "$TARGET" = "production" ]; then
            pnpm dlx vercel@latest build --prod --token=$VERCEL_TOKEN
          else
            pnpm dlx vercel@latest build --token=$VERCEL_TOKEN
          fi

      - name: Deploy
        if: steps.gate.outputs.changed == 'true'
        run: |
          if [ "$TARGET" = "production" ]; then
            url=$(pnpm dlx vercel@latest deploy --prebuilt --prod --token=$VERCEL_TOKEN)
          else
            url=$(pnpm dlx vercel@latest deploy --prebuilt --token=$VERCEL_TOKEN)
          fi
          echo "## ${{ matrix.app }} → $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "$url" >> "$GITHUB_STEP_SUMMARY"
