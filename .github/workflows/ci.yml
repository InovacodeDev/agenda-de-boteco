name: CI

on:
  push:
    branches: [ release, beta, alfa ]
  pull_request:
    branches: [ release, beta, alfa ]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version-gate:
    name: Version Gate (tag check)
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      mobile_changed: ${{ steps.check.outputs.mobile_changed }}
      client_version: ${{ steps.check.outputs.client_version }}
      client_tag: ${{ steps.check.outputs.client_tag }}
      client_changed: ${{ steps.check.outputs.client_changed }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure version is not already deployed on this channel
        id: check
        run: |
          set -euo pipefail
          # Em pull_request, GITHUB_REF_NAME é "42/merge" — o canal é a branch base.
          channel="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"

          # Faixa de comparação: PR = base..head; push = antes..depois.
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            # checkout usa fetch-depth:0, então origin/BASE já está presente.
            # `...HEAD` (three-dot) diffa do merge-base até o merge ref do PR =
            # exatamente os arquivos que o PR altera. Não usar --depth aqui: um
            # fetch raso quebraria o merge-base se a base avançar pós-checkout.
            git fetch --no-tags origin "${GITHUB_BASE_REF}" || true
            range="origin/${GITHUB_BASE_REF}...HEAD"
          else
            before="${{ github.event.before }}"
            # Primeiro push da branch (before = zeros): trata como "mexeu no app".
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              range=""
            else
              range="${before}..${GITHUB_SHA}"
            fi
          fi

          git fetch --tags --force

          # Cada app Expo tem versão e tag próprias. O mobile mantém o formato
          # histórico "<canal>-v<versão>"; o mobile-client ganha prefixo para
          # não colidir quando as versões coincidirem.
          # Formato: <dir em apps/>:<prefixo do output>:<prefixo da tag>
          failed=0
          for entry in "mobile::" "mobile-client:client_:mobile-client-"; do
            IFS=':' read -r app out tag_prefix <<< "$entry"
            version=$(jq -r '.version' "apps/$app/package.json")
            tag="${tag_prefix}${channel}-v${version}"
            echo "${out}version=$version" >> "$GITHUB_OUTPUT"
            echo "${out}tag=$tag" >> "$GITHUB_OUTPUT"

            if [ -z "$range" ]; then
              changed=true
            elif git diff --name-only "$range" -- "apps/$app/" | grep -q .; then
              changed=true
            else
              changed=false
            fi
            if [ "$app" = "mobile" ]; then
              echo "mobile_changed=$changed" >> "$GITHUB_OUTPUT"
            else
              echo "${out}changed=$changed" >> "$GITHUB_OUTPUT"
            fi

            # Só valida a versão quando o app mudou — outras mudanças (web, docs,
            # CI) não são bloqueadas por versão já publicada.
            if [ "$changed" != "true" ]; then
              echo "apps/$app/ não mudou — version gate ignorado."
              continue
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::apps/$app/ mudou e a versão $version já foi publicada no canal $channel (tag $tag existe). Bumpe apps/$app/package.json."
              failed=1
              continue
            fi
            echo "Tag $tag ainda não existe — liberado."
          done
          exit "$failed"

  verify:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: version-gate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Typecheck
        run: pnpm run typecheck

      - name: Run Build
        run: pnpm run build

  # Cria a tag do canal só em push, e só para o app que mudou (senão a tag da
  # versão atual já existe de um push anterior). `git tag` é idempotente aqui:
  # pula se a tag já existe, para não falhar em pushes subsequentes.
  # NOTA: enquanto o deploy.yml não roda no GitHub, o CI é o dono das tags de
  # versão. Quando o deploy voltar a rodar, remover a criação de tag daqui
  # (ou do deploy.yml) para não duplicar — os dois tentariam criar a mesma tag.
  tag:
    name: Tag channel version
    runs-on: ubuntu-latest
    needs: [version-gate, verify]
    if: >-
      github.event_name == 'push' &&
      (needs.version-gate.outputs.mobile_changed == 'true' ||
       needs.version-gate.outputs.client_changed == 'true')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag version for this channel
        env:
          MOBILE_CHANGED: ${{ needs.version-gate.outputs.mobile_changed }}
          MOBILE_TAG: ${{ needs.version-gate.outputs.tag }}
          CLIENT_CHANGED: ${{ needs.version-gate.outputs.client_changed }}
          CLIENT_TAG: ${{ needs.version-gate.outputs.client_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          for entry in "$MOBILE_CHANGED:$MOBILE_TAG" "$CLIENT_CHANGED:$CLIENT_TAG"; do
            changed="${entry%%:*}"
            tag="${entry#*:}"
            [ "$changed" = "true" ] || continue
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag já existe — nada a fazer."
              continue
            fi
            git tag "$tag"
            # Tolera corrida: se outra execução (ou o deploy) criou a tag entre o
            # verify acima e este push, aceita em vez de falhar o job.
            if ! git push origin "refs/tags/$tag"; then
              git fetch --tags --force
              git rev-parse -q --verify "refs/tags/$tag" >/dev/null || exit 1
              echo "Tag $tag criada em paralelo — ok."
              continue
            fi
            echo "Tag $tag criada — este canal fica bloqueado até o próximo bump de versão."
          done
